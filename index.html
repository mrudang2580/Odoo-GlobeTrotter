    function App() {
      const [activeScreen, setActiveScreen] = useState('dashboard');
      const [isAuthenticated, setIsAuthenticated] = useState(true);
      const [activeTripId, setActiveTripId] = useState('t1');
      const [searchQuery, setSearchQuery] = useState('');

      const [activities] = useState(INITIAL_ACTIVITIES);

      const [newTripDesc, setNewTripDesc] = useState('');
      const [newTripStart, setNewTripStart] = useState('2026-09-15');
      const [newTripEnd, setNewTripEnd] = useState('2026-09-25');
      const [newTripBudget, setNewTripBudget] = useState(3000);
      const [newTripCover, setNewTripCover] = useState('https://images.unsplash.com/photo-1499856871958-5b9627545d1a?w=800');

      useEffect(() => {
        localStorage.setItem('gt_trips', JSON.stringify(trips));
      }, [trips]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3500);
      };

      const formatCur = (val) => {
        const num = Number(val || 0);
        if (currency === 'EUR') return `€${(num * 0.92).toFixed(0)}`;
        if (currency === 'GBP') return `£${(num * 0.79).toFixed(0)}`;
        if (currency === 'INR') return `₹${(num * 83.5).toLocaleString()}`;
        if (currency === 'JPY') return `¥${(num * 155).toLocaleString()}`;
        return `$${num.toLocaleString()}`;
      };

      const currentTrip = trips.find(t => t.id === activeTripId) || trips[0];

      const calculateBudget = (trip) => {
        if (!trip) return { totalCost: 0, limit: 2500, isOver: false, categories: { transport: 0, stay: 0, activities: 0, meals: 0 }, byDay: {} };
        let actCost = 0;
        const byDay = {};
        trip.stops.forEach(s => {
          s.activities.forEach(a => {
            const c = Number(a.cost || 0);
            actCost += c;
            byDay[s.start_date] = (byDay[s.start_date] || 0) + c;
          });
        });
        const cats = { transport: 0, stay: 0, activities: actCost, meals: 0 };
        (trip.expenses || []).forEach(e => {
          const c = e.category.toLowerCase();
          const amt = Number(e.amount || 0);
          if (cats[c] !== undefined) cats[c] += amt;
          else cats.activities += amt;
          byDay[e.date] = (byDay[e.date] || 0) + amt;
        });
        const total = cats.transport + cats.stay + cats.activities + cats.meals;
        const isOver = total > Number(trip.budget_limit || 2500);
        return { totalCost: total, limit: Number(trip.budget_limit || 2500), isOver, categories: cats, byDay };
      };

        e.preventDefault();
        const trip = {
          id: `t_${Date.now()}`,
          name: newTripName || 'New Voyage',
          description: newTripDesc || 'Custom multi-city journey',
          start_date: newTripStart,
          end_date: newTripEnd,
          budget_limit: Number(newTripBudget),
          cover_photo_url: newTripCover,
          status: 'upcoming',
          is_public: true,
          share_slug: `trip-${Date.now()}`,

              city_name: 'Paris',
              country: 'France',
              start_date: newTripStart,
              end_date: '2026-09-20',

              activities: [

          expenses: [
            { id: `e_${Date.now()}_1`, category: 'transport', amount: 400, date: newTripStart, description: 'Initial Transit Tickets' }

        setTrips([trip, ...trips]);
        setActiveTripId(trip.id);
        showToast(`🎉 "${trip.name}" created successfully!`);
        setActiveScreen('builder');

        const updated = trips.map(t => {
          if (t.id === activeTripId) {
            const newStop = {
              id: `s_${Date.now()}`,
              city_id: cityId || 'c2',
              city_name: cityName,
              country: country,
              start_date: '2026-09-21',
              end_date: '2026-09-25',
              budget: 800,
              activities: [{ id: `sa_${Date.now()}`, name: `${cityName} City Center Walk`, category: 'sightseeing', time: '02:00 PM', cost: 0 }]

            return { ...t, stops: [...t.stops, newStop] };
          }
          return t;
        });
        setTrips(updated);
        showToast(`📍 Stop "${cityName}" added to ${currentTrip.name}`);
      };

      const handleAddActivityToStop = (stopId) => {
        const actName = prompt('Enter Activity / Tour Name:', 'Guided Museum Tour');
        if (!actName) return;
        const actCost = Number(prompt('Enter Cost ($ USD):', '45')) || 0;
        const updated = trips.map(t => {
          if (t.id === activeTripId) {
            return {
              ...t,
              stops: t.stops.map(s => {
                if (s.id === stopId) {
                  return {
                    ...s,
                    activities: [...s.activities, { id: `sa_${Date.now()}`, name: actName, category: 'culture', time: '02:00 PM', cost: actCost }]

                }
                return s;
              })
            };
          }
          return t;
        });
        setTrips(updated);
        showToast(`✅ Activity "${actName}" scheduled!`);
      };

      const handleCloneTrip = () => {

          id: `t_${Date.now()}`,
          name: `Copy of ${currentTrip.name}`,
          status: 'upcoming',
          share_slug: `copy-${Date.now()}`

                        <h4 className="font-extrabold text-xs text-slate-900">{item.title}</h4>
                      </div>
                      <div className="pt-2 border-t border-slate-100 flex items-center justify-between text-[11px]">
                        <span className="text-slate-500">{item.time}</span>
                        <span className="font-bold text-emerald-600">{formatCur(item.cost)}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 13. SHARED / PUBLIC ITINERARY SCREEN */}
            {activeScreen === 'share' && currentTrip && (
              <div className="max-w-4xl mx-auto space-y-6">
                <div className="bg-sky-50 border border-sky-200 rounded-3xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <span className="px-3 py-1 rounded-full bg-sky-600 text-white text-[10px] font-black uppercase tracking-wider">Screen 13 of 13</span>
                    <h2 className="text-lg font-black text-slate-900 mt-1">Public Shareable Travel Guide</h2>
                    <p className="text-xs text-slate-600">Shareable URL: <code className="bg-white px-2 py-0.5 rounded font-mono text-sky-700">https://globetrotter.io/share/{currentTrip.share_slug}</code></p>
                  </div>

                  <button
                    onClick={handleCloneTrip}
                    className="px-5 py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl text-xs shadow-md shadow-sky-600/30 flex items-center gap-2 transition"
                  >
                    <i className="fa-solid fa-copy"></i> Fork & Clone Trip
                  </button>
                </div>

                <div className="relative rounded-3xl overflow-hidden shadow-xl">
                  <img src={currentTrip.cover_photo_url} alt={currentTrip.name} className="w-full h-72 object-cover" />
                  <div className="absolute inset-0 bg-gradient-to-t from-black/85 via-black/30 to-transparent"></div>
                  <div className="absolute bottom-6 left-6 right-6 text-white space-y-2">
                    <h1 className="text-3xl sm:text-4xl font-black">{currentTrip.name}</h1>
                    <p className="text-xs text-slate-200">{currentTrip.description}</p>
                  </div>
                </div>

                <div className="space-y-4">
                  {currentTrip.stops.map((stop, idx) => (
                    <div key={idx} className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                      <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                        <h3 className="font-extrabold text-base text-slate-900">
                          Stop {idx + 1}: {stop.city_name}, {stop.country}
                        </h3>
                        <span className="text-xs text-slate-500 font-medium">{stop.start_date} to {stop.end_date}</span>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        {stop.activities.map((act, i) => (
                          <div key={i} className="p-3 bg-slate-50 rounded-xl text-xs flex items-center justify-between">
                            <span className="font-bold text-slate-800">{act.name}</span>
                            <span className="font-black text-emerald-600">{formatCur(act.cost)}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 14. PROFILE SCREEN */}
            {activeScreen === 'profile' && (
              <div className="max-w-4xl mx-auto space-y-6">
                <div>
                  <span className="px-3 py-1 rounded-full bg-sky-50 text-sky-700 text-[11px] font-bold uppercase tracking-wider">User Settings</span>
                  <h1 className="text-3xl font-black text-slate-900 mt-1">User Profile & Preferences</h1>
                  <p className="text-xs text-slate-500">Manage your explorer credentials, default currencies, and travel records.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div className="bg-white p-6 rounded-3xl border border-slate-200 text-center space-y-4 shadow-sm">
                    <img src={user.photo_url} alt="Profile" className="w-24 h-24 rounded-2xl mx-auto object-cover ring-4 ring-sky-50" />
                    <div>
                      <h3 className="font-black text-lg text-slate-900">{user.name}</h3>
                      <p className="text-xs text-slate-500">{user.email}</p>
                      <span className="mt-2 inline-block px-3 py-0.5 bg-sky-50 text-sky-700 rounded-full text-xs font-bold">
                        {user.role}
                      </span>
                    </div>

                    <div className="pt-3 border-t border-slate-100 grid grid-cols-2 gap-2 text-center text-xs">
                      <div className="p-2.5 bg-slate-50 rounded-xl">
                        <span className="text-[10px] uppercase font-bold text-slate-400">Trips</span>
                        <p className="text-lg font-black text-slate-900">{trips.length}</p>
                      </div>
                      <div className="p-2.5 bg-slate-50 rounded-xl">
                        <span className="text-[10px] uppercase font-bold text-slate-400">Countries</span>
                        <p className="text-lg font-black text-slate-900">7</p>
                      </div>
                    </div>
                  </div>

                  <div className="md:col-span-2 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                    <h3 className="font-bold text-lg text-slate-900">Personal Information</h3>
                    <form onSubmit={(e) => { e.preventDefault(); showToast('Preferences updated!'); }} className="space-y-4 text-xs">
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="font-bold text-slate-700">Full Name</label>
                          <input
                            type="text"
                            value={user.name}
                            onChange={(e) => setUser({ ...user, name: e.target.value })}
                            className="w-full p-2.5 rounded-xl border border-slate-200 mt-1"
                          />
                        </div>
                        <div>
                          <label className="font-bold text-slate-700">Email Address</label>
                          <input
                            type="email"
                            value={user.email}
                            onChange={(e) => setUser({ ...user, email: e.target.value })}
                            className="w-full p-2.5 rounded-xl border border-slate-200 mt-1"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="font-bold text-slate-700">City</label>
                          <input
                            type="text"
                            value={user.city}
                            onChange={(e) => setUser({ ...user, city: e.target.value })}
                            className="w-full p-2.5 rounded-xl border border-slate-200 mt-1"
                          />
                        </div>
                        <div>
                          <label className="font-bold text-slate-700">Country</label>
                          <input
                            type="text"
                            value={user.country}
                            onChange={(e) => setUser({ ...user, country: e.target.value })}
                            className="w-full p-2.5 rounded-xl border border-slate-200 mt-1"
                          />
                        </div>
                      </div>

                      <button type="submit" className="px-5 py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl transition">
                        Save Changes
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            )}

            {/* 15. ADMIN & TELEMETRY HUB */}
            {activeScreen === 'admin' && (
              <div className="space-y-6">
                <div>
                  <span className="px-3 py-1 rounded-full bg-purple-50 text-purple-700 text-[11px] font-bold uppercase tracking-wider">Admin Telemetry</span>
                  <h1 className="text-3xl font-black text-slate-900 mt-1">Admin & Analytics Telemetry</h1>
                  <p className="text-xs text-slate-500">Platform-wide metrics, leaderboard rankings, and system health.</p>
                </div>

                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                  {[
                    { label: 'Registered Travelers', val: '14,280', icon: 'fa-users', color: 'text-sky-600 bg-sky-50' },
                    { label: 'Itineraries Created', val: '48,920', icon: 'fa-compass', color: 'text-emerald-600 bg-emerald-50' },
                    { label: 'Gross Budget Volume', val: '$38.4M', icon: 'fa-dollar-sign', color: 'text-amber-600 bg-amber-50' },
                    { label: 'API Uptime', val: '99.98%', icon: 'fa-server', color: 'text-purple-600 bg-purple-50' }
                  ].map((k, idx) => (
                    <div key={idx} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-1">
                      <div className="flex items-center justify-between">
                        <span className="text-[11px] font-bold uppercase text-slate-400">{k.label}</span>
                        <i className={`fa-solid ${k.icon} ${k.color} p-2 rounded-lg text-xs`}></i>
                      </div>
                      <h4 className="text-2xl font-black text-slate-900">{k.val}</h4>
                    </div>
                  ))}
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                    <h3 className="font-bold text-base text-slate-900">Top Destinations Leaderboard</h3>
                    <div className="space-y-2 text-xs">
                      {cities.slice(0, 5).map((c, i) => (
                        <div key={c.id} className="p-3 bg-slate-50 rounded-xl flex items-center justify-between">
                          <div className="flex items-center gap-3">
                            <span className="w-6 h-6 rounded-lg bg-sky-100 text-sky-700 font-bold flex items-center justify-center text-xs">
                              {i + 1}
                            </span>
                            <span className="font-bold text-slate-900">{c.name}, {c.country}</span>
                          </div>
                          <span className="font-black text-amber-500">★ {c.popularity_score}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                    <h3 className="font-bold text-base text-slate-900">Top Booked Activities</h3>
                    <div className="space-y-2 text-xs">
                      {activities.slice(0, 5).map((a, i) => (
                        <div key={a.id} className="p-3 bg-slate-50 rounded-xl flex items-center justify-between">
                          <span className="font-bold text-slate-900">{a.name}</span>
                          <span className="font-black text-emerald-600">{formatCur(a.cost)}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* City Detail Modal */}
            {selectedCityModal && (
              <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl space-y-4">
                  <div className="relative h-48 w-full">
                    <img src={selectedCityModal.image_url} alt={selectedCityModal.name} className="w-full h-full object-cover" />
                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                    <div className="absolute bottom-4 left-4 right-4 text-white">
                      <h3 className="text-2xl font-black">{selectedCityModal.name}</h3>
                      <p className="text-xs text-sky-300">{selectedCityModal.country} • {selectedCityModal.region}</p>
                    </div>
                  </div>

                  <div className="px-6 space-y-3 text-xs">
                    <p className="text-slate-600 leading-relaxed">{selectedCityModal.description}</p>
                    <div className="grid grid-cols-2 gap-3 p-3 bg-slate-50 rounded-xl">
                      <div>
                        <span className="text-slate-400 font-bold uppercase text-[10px]">Popularity:</span>
                        <p className="font-extrabold text-slate-900 mt-0.5">★ {selectedCityModal.popularity_score} / 100</p>
                      </div>
                      <div>
                        <span className="text-slate-400 font-bold uppercase text-[10px]">Cost Index:</span>
                        <p className="font-extrabold text-emerald-600 mt-0.5">{'$'.repeat(selectedCityModal.cost_index)}</p>
                      </div>
                    </div>
                  </div>

                  <div className="px-6 pb-6 flex items-center justify-end gap-2 text-xs">
                    <button
                      onClick={() => setSelectedCityModal(null)}
                      className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-xl font-bold"
                    >
                      Close
                    </button>
                    <button
                      onClick={() => {
                        handleAddStopToTrip(selectedCityModal.name, selectedCityModal.country, selectedCityModal.id);
                        setSelectedCityModal(null);
                      }}
                      className="px-4 py-2 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl shadow-md transition"
                    >
                      Add to Trip
                    </button>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 mt-12 py-6 text-xs text-slate-500">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <span className="font-bold text-slate-900">GlobeTrotter</span>
                <span>• Built for Odoo Hackathon 2026</span>
              </div>
              <div className="flex items-center gap-4 font-semibold">
                <button onClick={() => setActiveScreen('dashboard')} className="hover:text-sky-600">Dashboard</button>
                <button onClick={() => setActiveScreen('login')} className="hover:text-sky-600">Login</button>
                <button onClick={() => setActiveScreen('signup')} className="hover:text-sky-600">Signup</button>
                <button onClick={() => setActiveScreen('forgot_password')} className="hover:text-sky-600">Password</button>
                <button onClick={() => setActiveScreen('admin')} className="hover:text-sky-600">Admin</button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
