<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlobeTrotter — Empowering Personalized Travel Planning</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0284c7', 600: '#0369a1', 700: '#075985' },
            accent: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_CITIES = [
      { id: 'c1', name: 'Paris', country: 'France', region: 'Europe', cost_index: 4, popularity_score: 98, image_url: 'https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=800', description: 'The City of Light, famed for world-class art, fashion, gastronomy, and romantic architecture.' },
      { id: 'c2', name: 'Tokyo', country: 'Japan', region: 'Asia', cost_index: 4, popularity_score: 96, image_url: 'https://images.unsplash.com/photo-1503899036084-c55cdd92da26?w=800', description: 'A vibrant metropolis blending futuristic high-rises with historic temples and culinary delights.' },
      { id: 'c3', name: 'Rome', country: 'Italy', region: 'Europe', cost_index: 3, popularity_score: 94, image_url: 'https://images.unsplash.com/photo-1552832230-c0197dd311b5?w=800', description: 'An open-air museum filled with ancient ruins, Renaissance art, and world-class espresso.' },
      { id: 'c4', name: 'Barcelona', country: 'Spain', region: 'Europe', cost_index: 3, popularity_score: 92, image_url: 'https://images.unsplash.com/photo-1583422409516-2895a77efded?w=800', description: 'Cosmopolitan seaside city renowned for Gaudí architecture, Mediterranean beaches, and tapas.' },
      { id: 'c5', name: 'Bali', country: 'Indonesia', region: 'Asia', cost_index: 2, popularity_score: 95, image_url: 'https://images.unsplash.com/photo-1537996194471-e657df975ab4?w=800', description: 'Tropical paradise known for volcanic mountains, iconic rice paddies, and coral reefs.' },
      { id: 'c6', name: 'New York City', country: 'USA', region: 'North America', cost_index: 5, popularity_score: 99, image_url: 'https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?w=800', description: 'The Big Apple with iconic skyscrapers, Broadway shows, diverse neighborhoods, and 24/7 energy.' }
    ];

    const INITIAL_TRIPS = [
      {
        id: 't1',
        name: 'European Grand Heritage Odyssey',
        description: 'A 10-day multi-city journey crossing Paris, Rome, and Barcelona.',
        start_date: '2026-09-10',
        end_date: '2026-09-20',
        budget_limit: 3200,
        cover_photo_url: 'https://images.unsplash.com/photo-1499856871958-5b9627545d1a?w=800',
        status: 'upcoming',
        is_public: true,
        share_slug: 'euro-grand-2026',
        stops: [
          {
            id: 's1', city_id: 'c1', city_name: 'Paris', country: 'France', start_date: '2026-09-10', end_date: '2026-09-13', budget: 1200,
            activities: [
              { id: 'sa1', name: 'Eiffel Tower Summit Access', category: 'sightseeing', time: '10:00 AM', cost: 35 },
              { id: 'sa2', name: 'Louvre Masterpieces Guided Tour', category: 'culture', time: '02:30 PM', cost: 65 }
            ]
          },
          {
            id: 's2', city_id: 'c3', city_name: 'Rome', country: 'Italy', start_date: '2026-09-14', end_date: '2026-09-17', budget: 1000,
            activities: [
              { id: 'sa3', name: 'Colosseum & Roman Forum Tour', category: 'sightseeing', time: '09:30 AM', cost: 48 },
              { id: 'sa4', name: 'Trastevere Sunset Food & Wine Walk', category: 'food', time: '06:00 PM', cost: 65 }
            ]
          }
        ],
        expenses: [
          { id: 'e1', category: 'transport', amount: 550, date: '2026-09-10', description: 'Flights & Rail' },
          { id: 'e2', category: 'stay', amount: 1100, date: '2026-09-10', description: 'Hotel Bookings' },
          { id: 'e3', category: 'meals', amount: 480, date: '2026-09-12', description: 'Dining' }
        ]
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [activeTripId, setActiveTripId] = useState('t1');
      const [searchQuery, setSearchQuery] = useState('');
      const [filterRegion, setFilterRegion] = useState('All');
      const [trips, setTrips] = useState(() => {
        const saved = localStorage.getItem('gt_trips');
        return saved ? JSON.parse(saved) : INITIAL_TRIPS;
      });
      const [cities] = useState(INITIAL_CITIES);
      const [user, setUser] = useState({
        name: 'Alex Wanderer', email: 'alex@globetrotter.io', role: 'Traveler & Explorer',
        city: 'San Francisco', country: 'USA', photo_url: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150'
      });
      const [showAddStopModal, setShowAddStopModal] = useState(false);
      const [showAddActivityModal, setShowAddActivityModal] = useState(false);
      const [selectedStopId, setSelectedStopId] = useState('');
      const [toastMessage, setToastMessage] = useState('');

      useEffect(() => {
        localStorage.setItem('gt_trips', JSON.stringify(trips));
      }, [trips]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3500);
      };

      const currentTrip = trips.find(t => t.id === activeTripId) || trips[0];

      const calculateBudget = (trip) => {
        if (!trip) return { totalCost: 0, limit: 2500, isOver: false, categories: { transport: 0, stay: 0, activities: 0, meals: 0 } };
        let actCost = 0;
        trip.stops.forEach(s => s.activities.forEach(a => { actCost += Number(a.cost || 0); }));
        const cats = { transport: 0, stay: 0, activities: actCost, meals: 0 };
        trip.expenses.forEach(e => {
          const c = e.category.toLowerCase();
          if (cats[c] !== undefined) cats[c] += Number(e.amount || 0);
          else cats.activities += Number(e.amount || 0);
        });
        const total = Object.values(cats).reduce((a, b) => a + b, 0);
        const limit = Number(trip.budget_limit || 2500);
        return { totalCost: total, limit, isOver: total > limit, categories: cats };
      };

      const bInfo = calculateBudget(currentTrip);

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center gap-3 border border-slate-700 animate-bounce">
              <i className="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
              <span className="text-sm font-medium">{toastMessage}</span>
            </div>
          )}

          <header className="bg-white border-b border-slate-100 sticky top-0 z-40 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div onClick={() => setActiveTab('dashboard')} className="flex items-center gap-2.5 cursor-pointer select-none">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-600 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-sky-500/20">
                  <i className="fa-solid fa-compass text-lg"></i>
                </div>
                <div>
                  <span className="font-extrabold text-xl tracking-tight text-slate-900">Globe<span className="text-sky-600">Trotter</span></span>
                  <span className="hidden md:inline-block ml-2 text-[10px] uppercase font-bold tracking-widest px-2 py-0.5 bg-sky-50 text-sky-700 rounded-full border border-sky-200">Hackathon Edition</span>
                </div>
              </div>

              <nav className="hidden lg:flex items-center gap-1 text-sm font-semibold text-slate-600">
                {[
                  { id: 'dashboard', label: 'Dashboard', icon: 'fa-house' },
                  { id: 'trips', label: 'My Trips', icon: 'fa-suitcase-rolling' },
                  { id: 'builder', label: 'Itinerary Builder', icon: 'fa-route' },
                  { id: 'itinerary_view', label: 'Timeline View', icon: 'fa-calendar-days' },
                  { id: 'budget', label: 'Budget & Analytics', icon: 'fa-chart-pie' },
                  { id: 'search_cities', label: 'Discover', icon: 'fa-magnifying-glass' },
                  { id: 'admin', label: 'Admin', icon: 'fa-shield-halved' },
                ].map(item => (
                  <button key={item.id} onClick={() => setActiveTab(item.id)} className={`px-3.5 py-2 rounded-xl transition flex items-center gap-2 ${activeTab === item.id ? 'bg-sky-50 text-sky-700 font-bold' : 'hover:bg-slate-100 hover:text-slate-900'}`}>
                    <i className={`fa-solid ${item.icon} text-xs opacity-70`}></i> {item.label}
                  </button>
                ))}
              </nav>

              <div className="flex items-center gap-3">
                <button onClick={() => setActiveTab('create_trip')} className="px-4 py-2 bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-700 hover:to-blue-700 text-white rounded-xl text-xs font-bold shadow-md shadow-sky-500/20 flex items-center gap-2 transition">
                  <i className="fa-solid fa-plus"></i> <span>Plan New Trip</span>
                </button>
                <button onClick={() => setActiveTab('profile')} className="w-10 h-10 rounded-xl overflow-hidden border-2 border-slate-200 hover:border-sky-500 transition shadow-sm">
                  <img src={user.photo_url} alt="Profile" className="w-full h-full object-cover" />
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
            {activeTab === 'dashboard' && (
              <div className="space-y-8 animate-fadeIn">
                <div className="relative rounded-3xl overflow-hidden bg-slate-900 text-white p-8 md:p-12 shadow-xl">
                  <div className="absolute inset-0 bg-cover bg-center opacity-40 mix-blend-overlay" style={{ backgroundImage: 'url(https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=1600)' }}></div>
                  <div className="relative z-10 max-w-2xl space-y-4">
                    <span className="inline-flex items-center gap-2 px-3 py-1 bg-white/10 backdrop-blur-md rounded-full text-xs font-bold tracking-wider uppercase text-amber-300 border border-white/10">
                      <i className="fa-solid fa-wand-magic-sparkles"></i> AI Multi-City Planner
                    </span>
                    <h1 className="text-3xl md:text-5xl font-black tracking-tight leading-tight">Dream, Design, and Conquer Every Destination.</h1>
                    <p className="text-slate-200 text-sm md:text-base leading-relaxed">Construct multi-city itineraries, explore curated city attractions with cost indexing, and automate budgeting with instant over-budget alerts.</p>
                    <div className="flex flex-wrap items-center gap-3 pt-2">
                      <button onClick={() => setActiveTab('create_trip')} className="px-6 py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl text-sm shadow-lg shadow-amber-500/20 transition flex items-center gap-2">
                        <i className="fa-solid fa-plane-departure"></i> Start Planning
                      </button>
                      <button onClick={() => setActiveTab('search_cities')} className="px-6 py-3 bg-white/10 hover:bg-white/20 text-white font-semibold rounded-xl text-sm backdrop-blur-md transition flex items-center gap-2 border border-white/20">
                        <i className="fa-solid fa-compass"></i> Explore Destinations
                      </button>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">
                    <div className="w-12 h-12 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center text-xl font-bold"><i className="fa-solid fa-earth-americas"></i></div>
                    <div><span className="text-xs text-slate-400 font-semibold uppercase">Active Trips</span><p className="text-2xl font-black text-slate-900">{trips.length}</p></div>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">
                    <div className="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl font-bold"><i className="fa-solid fa-city"></i></div>
                    <div><span className="text-xs text-slate-400 font-semibold uppercase">Total Stops</span><p className="text-2xl font-black text-slate-900">{trips.reduce((a, t) => a + t.stops.length, 0)}</p></div>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">
                    <div className="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl font-bold"><i className="fa-solid fa-ticket"></i></div>
                    <div><span className="text-xs text-slate-400 font-semibold uppercase">Activities</span><p className="text-2xl font-black text-slate-900">{trips.reduce((a, t) => a + t.stops.reduce((x, s) => x + s.activities.length, 0), 0)}</p></div>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">
                    <div className="w-12 h-12 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-xl font-bold"><i className="fa-solid fa-wallet"></i></div>
                    <div><span className="text-xs text-slate-400 font-semibold uppercase">Projected Cost</span><p className="text-2xl font-black text-slate-900">${bInfo.totalCost}</p></div>
                  </div>
                </div>

                <div>
                  <div className="flex items-center justify-between mb-4">
                    <h2 className="text-xl font-extrabold text-slate-900">Top Regional Selections</h2>
                    <button onClick={() => setActiveTab('search_cities')} className="text-xs font-bold text-sky-600 hover:text-sky-800">View All Cities →</button>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                    {cities.slice(0, 4).map(city => (
                      <div key={city.id} className="bg-white rounded-2xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-md transition">
                        <div className="h-40 bg-cover bg-center relative" style={{ backgroundImage: `url(${city.image_url})` }}>
                          <span className="absolute top-3 right-3 bg-slate-900/80 backdrop-blur-md text-amber-400 text-xs font-bold px-2 py-0.5 rounded-lg"><i className="fa-solid fa-star text-[10px] mr-1"></i>{city.popularity_score}/100</span>
                        </div>
                        <div className="p-4">
                          <h3 className="font-bold text-base text-slate-900">{city.name}</h3>
                          <p className="text-xs text-slate-500 mb-3">{city.country} • {city.region}</p>
                          <div className="flex items-center justify-between pt-2 border-t border-slate-100 text-xs">
                            <span className="font-semibold text-slate-700">Cost: {'$'.repeat(city.cost_index)}</span>
                            <button onClick={() => { setActiveTripId('t1'); setActiveTab('builder'); showToast(`Opening builder for ${city.name}`); }} className="text-xs font-bold text-sky-600 hover:text-sky-800">+ Add to Plan</button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'trips' && (
              <div className="space-y-6 animate-fadeIn">
                <div className="flex items-center justify-between">
                  <div><h1 className="text-2xl font-black text-slate-900">My Trips</h1><p className="text-xs text-slate-500">Manage ongoing, upcoming, and past multi-city itineraries.</p></div>
                  <button onClick={() => setActiveTab('create_trip')} className="px-4 py-2.5 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-xs font-bold shadow flex items-center gap-2"><i className="fa-solid fa-plus"></i> Create Trip</button>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {trips.map(trip => (
                    <div key={trip.id} className="bg-white rounded-2xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                      <div className="h-44 bg-cover bg-center relative" style={{ backgroundImage: `url(${trip.cover_photo_url})` }}>
                        <span className="absolute top-3 right-3 text-[10px] font-extrabold px-2.5 py-1 rounded-full uppercase bg-white/90 text-slate-900 shadow">{trip.status}</span>
                      </div>
                      <div className="p-5 flex-1 flex flex-col justify-between space-y-4">
                        <div>
                          <h3 className="font-bold text-base text-slate-900 mb-1">{trip.name}</h3>
                          <p className="text-xs text-slate-500 line-clamp-2 mb-3">{trip.description}</p>
                          <div className="space-y-1.5 text-xs text-slate-600">
                            <div className="flex items-center gap-2"><i className="fa-regular fa-calendar text-sky-600 w-4"></i>{trip.start_date} → {trip.end_date}</div>
                            <div className="flex items-center gap-2"><i className="fa-solid fa-map-pin text-sky-600 w-4"></i>{trip.stops.length} Stops ({trip.stops.map(s => s.city_name).join(', ')})</div>
                            <div className="flex items-center gap-2"><i className="fa-solid fa-wallet text-sky-600 w-4"></i>${trip.budget_limit} Budget Target</div>
                          </div>
                        </div>
                        <div className="flex items-center gap-2 pt-3 border-t border-slate-100">
                          <button onClick={() => { setActiveTripId(trip.id); setActiveTab('builder'); }} className="flex-1 py-2 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-xs font-bold transition">Edit Stops</button>
                          <button onClick={() => { setActiveTripId(trip.id); setActiveTab('itinerary_view'); }} className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition">View</button>
                          <button onClick={() => { setTrips(trips.filter(t => t.id !== trip.id)); showToast(`Deleted trip`); }} className="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl text-xs transition"><i className="fa-solid fa-trash"></i></button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'create_trip' && (
              <div className="max-w-2xl mx-auto bg-white p-8 rounded-3xl border border-slate-100 shadow-sm animate-fadeIn space-y-6">
                <div><h1 className="text-2xl font-black text-slate-900">Plan a New Multi-City Trip</h1><p className="text-xs text-slate-500">Initiate your voyage with basic parameters and target budgets.</p></div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const newTrip = {
                    id: 't_' + Date.now(),
                    name: form.trip_name.value,
                    description: form.trip_desc.value,
                    start_date: form.start_date.value,
                    end_date: form.end_date.value,
                    budget_limit: Number(form.budget_limit.value || 2500),
                    cover_photo_url: form.cover_photo.value || 'https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=800',
                    status: 'upcoming',
                    is_public: true,
                    share_slug: form.trip_name.value.toLowerCase().replace(/\s+/g, '-') + '-' + Math.floor(Math.random()*1000),
                    stops: [{ id: 's_' + Date.now(), city_id: 'c1', city_name: 'Paris', country: 'France', start_date: form.start_date.value, end_date: form.end_date.value, budget: 1000, activities: [] }],
                    expenses: []
                  };
                  setTrips([newTrip, ...trips]);
                  setActiveTripId(newTrip.id);
                  setActiveTab('builder');
                  showToast('Trip created! Start adding stops.');
                }} className="space-y-4 text-xs font-semibold text-slate-700">
                  <div><label className="block mb-1">Trip Name</label><input name="trip_name" required defaultValue="Mediterranean Summer Escape" className="w-full p-3 border rounded-xl text-sm font-normal focus:ring-2 focus:ring-sky-500 outline-none" /></div>
                  <div className="grid grid-cols-2 gap-4">
                    <div><label className="block mb-1">Start Date</label><input name="start_date" type="date" required defaultValue="2026-08-01" className="w-full p-3 border rounded-xl text-sm font-normal focus:ring-2 focus:ring-sky-500 outline-none" /></div>
                    <div><label className="block mb-1">End Date</label><input name="end_date" type="date" required defaultValue="2026-08-10" className="w-full p-3 border rounded-xl text-sm font-normal focus:ring-2 focus:ring-sky-500 outline-none" /></div>
                  </div>
                  <div><label className="block mb-1">Estimated Target Budget ($)</label><input name="budget_limit" type="number" defaultValue="3500" className="w-full p-3 border rounded-xl text-sm font-normal focus:ring-2 focus:ring-sky-500 outline-none" /></div>
                  <div><label className="block mb-1">Cover Photo URL</label><input name="cover_photo" defaultValue="https://images.unsplash.com/photo-1506973035872-a4ec16b8e8d9?w=800" className="w-full p-3 border rounded-xl text-sm font-normal focus:ring-2 focus:ring-sky-500 outline-none" /></div>
                  <div><label className="block mb-1">Description</label><textarea name="trip_desc" rows="3" defaultValue="Scenic multi-city tour through majestic coastal towns and historic architecture." className="w-full p-3 border rounded-xl text-sm font-normal focus:ring-2 focus:ring-sky-500 outline-none"></textarea></div>
                  <button type="submit" className="w-full py-3.5 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl text-sm shadow transition">Save & Build Itinerary →</button>
                </form>
              </div>
            )}

            {activeTab === 'builder' && currentTrip && (
              <div className="space-y-6 animate-fadeIn">
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                  <div>
                    <span className="text-[10px] font-bold uppercase tracking-widest text-sky-600">Active Itinerary</span>
                    <h1 className="text-2xl font-black text-slate-900">{currentTrip.name}</h1>
                    <p className="text-xs text-slate-500">{currentTrip.start_date} → {currentTrip.end_date} • {currentTrip.stops.length} Cities in Sequence</p>
                  </div>
                  <div className="flex items-center gap-3">
                    <button onClick={() => setShowAddStopModal(true)} className="px-4 py-2.5 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-xs font-bold shadow flex items-center gap-2 transition">
                      <i className="fa-solid fa-plus"></i> Add Stop / City
                    </button>
                    <button onClick={() => setActiveTab('itinerary_view')} className="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition flex items-center gap-2">
                      <i className="fa-solid fa-eye"></i> View Timeline
                    </button>
                  </div>
                </div>

                <div className="space-y-4">
                  {currentTrip.stops.map((stop, idx) => (
                    <div key={stop.id} className="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm space-y-4">
                      <div className="flex items-start justify-between">
                        <div className="flex items-center gap-4">

                </form>
              </div>
            </div>
          )}

          <footer className="bg-white border-t border-slate-100 py-6 text-center text-xs text-slate-400">
            <p>GlobeTrotter — Odoo Hackathon 2026 Solution • 4-Person Modular Repository System</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
